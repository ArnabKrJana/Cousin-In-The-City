spring:
  application:
    name: agent-orchestrator
  profiles:
    active: gemini  # Default to Cloud LLM for stability (switch to 'ollama' to run locally)

  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  datasource:
    url: jdbc:postgresql://localhost:5432/vector_db?timezone=Asia/Kolkata
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  rabbitmq:
    host: localhost
    port: 5672
    username: myuser
    password: secret
    
  cache:
    redis:
      time-to-live-hours: ${REDIS_CACHE_TTL_HOURS:24}

  ai:
    # We ALWAYS keep Ollama embedding enabled because Vector DBs break if you change models
    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: true
        options:
          model: nomic-embed-text:latest
      chat:
        enabled: false # Handled by profiles below
        
    # Ensure Google GenAI embeddings are completely disabled
    google:
      genai:
        embedding:
          enabled: false
        chat:
          enabled: false # Handled by profiles below

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

---
# ==========================================
# OLLAMA PROFILE (Local 4GB VRAM)
# ==========================================
spring:
  config:
    activate:
      on-profile: ollama
  autoconfigure:
    exclude: 
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration
  ai:
    google:
      genai:
        api-key: dummy_key
    ollama:
      chat:
        enabled: true
        options:
          model: gemma4:e2b
          temperature: 1
          format: json
          top-k: 64
          top-p: 0.95
          num-ctx: 8192

---
# ==========================================
# GEMINI PROFILE (Cloud 2-Million Token Context)
# ==========================================
spring:
  config:
    activate:
      on-profile: gemini
  autoconfigure:
    exclude: 
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:Enter_Your_Gemini_Key_Here}
        chat:
          enabled: true
          options:
            model: gemini-3.6-flash
            temperature: 0.7
