spring:
  application:
    name: agent-orchestrator

  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  # Postgres Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/vector_db?timezone=Asia/Kolkata
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  # RabbitMQ Connection
  rabbitmq:
    host: localhost
    port: 5672
    username: myuser
    password: secret
    
  # Redis Caching Configuration
  cache:
    redis:
      time-to-live-hours: ${REDIS_CACHE_TTL_HOURS:24}

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4:e2b
          temperature: 1
          top-k: 64
          top-p: 0.95
          num-ctx: 8192
      embedding:
        options:
          model: nomic-embed-text:latest

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
