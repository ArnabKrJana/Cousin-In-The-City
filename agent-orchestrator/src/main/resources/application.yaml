spring:
  application:
    name: agent-orchestrator

  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only # Ensure it doesn't shut down DBs for other modules

  # Postgres Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/vector_db?timezone=Asia/Kolkata
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # RabbitMQ Connection
  rabbitmq:
    host: localhost
    port: 5672
    username: myuser
    password: secret

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.1
      embedding:
        options:
          model: nomic-embed-text:latest

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
